# ─── greencross-crew — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-crew
        uses: actions/checkout@v7
        with:
          path: greencross-crew

      # incentive_math_test.js checks crew's bonus math against the LEADERBOARD's implementation and
      # SKIPS when that repo is not a sibling checkout. Until now it never was one here, so the drift
      # check ran only on one Mac while the green tick implied it had run everywhere. Public repo, so
      # the default GITHUB_TOKEN reaches it — no secret to create, rotate or leak.
      - name: Check out greencross-leaderboard
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-leaderboard
          path: greencross-leaderboard

      # AND NO OTHER SIBLING IS NEEDED — checked, not assumed. incentive_math_test.js is the ONLY
      # suite in this repo that reads outside it (`../../greencross-leaderboard/index.html`); every
      # other one reads crew's own source or its own frozen fixtures.
      #
      # DO NOT ADD A greencross-command-center CHECKOUT. It gets proposed because
      # threshold_audit_test.js is about GX Core's library surface — but that test reads NO hub
      # source. It checks crew's `GXCore.*` call sites against LIB_SURFACE, a list maintained inside
      # the test file and verified against the hub's .gs by a human. It does not skip here, and a hub
      # checkout would not make it cover one line more.
      #
      # The reason this warning is worth the space: the hub is PRIVATE, so a spoke's default
      # GITHUB_TOKEN cannot reach it, and the only way past that is a PAT secret to create, rotate and
      # leak — bought for coverage that ALREADY runs somewhere better. The hub's own CI checks out all
      # seven spokes, this one included, and runs gxcore_surface_test.js against the real library
      # surface. That is the check that catches a LIB_SURFACE list gone stale, and it lives next to
      # the library it is checking rather than next to a copy of a list.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-crew
        run: sh ./gx-preflight.sh

      # Say what did NOT run. A green tick reports that every test EXITED 0, which is not the same
      # as every test having COVERED something: a suite that skips prints a pass line and looks
      # identical to one that ran.
      # If the Leaderboard checkout above ever fails or is removed, the incentive drift check goes
      # back to skipping — and THIS is what says so, instead of a green tick that means less than
      # it did the week before.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-crew
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            if [ -d ../greencross-leaderboard ]; then
              echo "Leaderboard checked out — incentive_math_test.js's drift check could run."
              # ...AND SAY WHAT IT FOUND, because "could run" and "compared something" are different
              # claims and this line used to make the stronger one. The transplant is finished:
              # calcBud/calcMgr/calcAdmin are GONE from Leaderboard's index.html, so the drift half
              # now compares ZERO functions and prints "– … no longer in Leaderboard" — which is not
              # a SKIP marker, so the per-file list above shows a plain ✅. That is correct, not a
              # hole: the 12,040-combination browser-vs-engine comparison against the FROZEN oracle
              # is the coverage that matters, it runs here, and the oracle is frozen on purpose
              # because that dashboard is expected to be deleted. The checkout stays so the drift
              # check speaks up again if Leaderboard ever grows a copy of the pay math back.
              # Matches ONLY the drift check's own two verdicts ("frozen oracle still matches …" /
              # "… no longer in Leaderboard"). A looser pattern on the word Leaderboard also catches
              # the budtender line, which is a different check entirely and would read as evidence
              # the drift comparison did something.
              node tests/incentive_math_test.js 2>&1 \
                | grep -E 'frozen oracle still matches|no longer in Leaderboard' \
                | sed 's/^ */- /' || true
            else
              echo "> **Leaderboard absent.** incentive_math_test.js's drift check did NOT run here."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
