# ─── greencross-crew — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-crew
        uses: actions/checkout@v7
        with:
          path: greencross-crew

      # incentive_math_test.js checks crew's bonus math against the LEADERBOARD's implementation and
      # SKIPS when that repo is not a sibling checkout. Until now it never was one here, so the drift
      # check ran only on one Mac while the green tick implied it had run everywhere. Public repo, so
      # the default GITHUB_TOKEN reaches it — no secret to create, rotate or leak.
      - name: Check out greencross-leaderboard
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-leaderboard
          path: greencross-leaderboard

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run the gate
        working-directory: greencross-crew
        run: sh ./gx-preflight.sh

      # Say what did NOT run. A green tick reports that every test EXITED 0, which is not the same
      # as every test having COVERED something: a suite that skips prints a pass line and looks
      # identical to one that ran.
      # If the Leaderboard checkout above ever fails or is removed, the incentive drift check goes
      # back to skipping — and THIS is what says so, instead of a green tick that means less than
      # it did the week before.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-crew
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              if printf '%s' "$out" | grep -qiE '^SKIP|not a sibling|checkout not present'; then
                echo "- ⚠️ \`$t\` — **SKIPPED**: $(printf '%s' "$out" | grep -iE '^SKIP|not a sibling|checkout not present' | head -1)"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            if [ -d ../greencross-leaderboard ]; then
              echo "Leaderboard checked out — the incentive drift check ran."
            else
              echo "> **Leaderboard absent.** incentive_math_test.js's drift check did NOT run here."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
