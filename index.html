<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GX Crew</title>
  <!-- Shared GX runtime (theme + resilient GX Core client) — same-origin org Pages -->
  <link rel="stylesheet" href="https://greencrosscanna.github.io/greencross-gx-theme/gx-theme.css">
  <script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-client.js"></script>
  <style>
    /* Shell layout only. Every colour comes from gx-theme.css tokens — never hardcode one here,
       or the app drifts out of the suite's look the next time the theme moves. */
    body { margin: 0; min-height: 100vh; font-size: 15px; }
    .gx-topbar { display: flex; align-items: baseline; gap: var(--gx-gap-lg); padding: 14px 20px;
      border-bottom: 1px solid var(--gx-border); }
    .gx-wordmark b { color: var(--gx-green); }
    .gx-topbar-sub { color: var(--gx-text-mute); font-size: 12px; text-transform: uppercase;
      letter-spacing: 1.1px; font-weight: 600; }
    .gx-main { padding: 28px 20px; max-width: 980px; margin: 0 auto; }
    .gx-card { padding: 22px; }
    .gx-card h1 { margin: 0 0 6px; font-size: 20px; color: var(--gx-text); }
    .gx-muted { color: var(--gx-text-dim); }
    code { background: var(--gx-surface-3); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-sm); padding: 1px 5px; font-size: .9em; }

    /* ── Roster view ─────────────────────────────────────────────────────── */
    .crew-bar { display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 4px 0 16px; font-size: 13px; color: var(--gx-text-dim); }
    .crew-bar b { color: var(--gx-text); }
    .crew-link { background: none; border: 0; color: var(--gx-green); cursor: pointer;
      font: inherit; padding: 0; }
    .crew-link:hover { text-decoration: underline; }
    .crew-count { font-weight: 400; font-size: 14px; }

    .crew-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .crew-table th, .crew-table td { text-align: left; padding: 9px 10px;
      border-bottom: 1px solid var(--gx-border); vertical-align: middle; }
    .crew-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 1.1px;
      color: var(--gx-text-mute); font-weight: 600; }
    .crew-table th .gx-muted { text-transform: none; letter-spacing: 0; }
    .crew-table tr:last-child td { border-bottom: 0; }
    .crew-table td b { color: var(--gx-text); }
    .crew-table input, .crew-table select {
      background: var(--gx-surface-3); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius); color: var(--gx-text);
      padding: 5px 8px; font-size: 13px; font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .crew-table input:focus, .crew-table select:focus {
      border-color: var(--gx-green-dim); box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-table input:disabled, .crew-table select:disabled { opacity: .5; cursor: default; }
    /* Dark-scheme form controls: without this the native date picker renders black-on-black. */
    .crew-table input, .crew-table select, .crew-login input { color-scheme: dark; }

    .crew-save {
      background: transparent; color: var(--gx-text-dim);
      border: 1px solid var(--gx-border-strong); border-radius: var(--gx-radius);
      padding: 5px 12px; font-size: 12px; font-family: inherit; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .crew-save:hover:not(:disabled) { color: var(--gx-text); border-color: var(--gx-green); }
    .crew-save:disabled { opacity: .45; cursor: default; }
    .crew-save-status { margin-left: 8px; font-size: 11px; color: var(--gx-text-mute); }
    .crew-save-status.ok  { color: var(--gx-green); }
    .crew-save-status.err { color: var(--gx-red); }
    .crew-hint { font-size: 11px; color: var(--gx-text-mute); }

    .crew-banner { padding: 10px 12px; border-radius: var(--gx-radius-md);
      font-size: 12px; margin: 0 0 14px; line-height: 1.5; }
    .crew-banner-warn  { background: var(--gx-gold-soft); border: 1px solid var(--gx-gold-line);
      color: var(--gx-gold); }
    .crew-banner-error { background: var(--gx-red-soft); border: 1px solid var(--gx-red);
      color: var(--gx-red); }

    .crew-login { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin-top: 14px; }
    .crew-login label { display: flex; flex-direction: column; gap: 5px;
      font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase;
      color: var(--gx-text-mute); font-weight: 600; }
    .crew-login input {
      width: 100%; background: var(--gx-surface-3); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius); color: var(--gx-text); padding: 9px 12px;
      font-size: 14px; font-family: inherit; letter-spacing: normal; text-transform: none;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .crew-login input:focus { border-color: var(--gx-green-dim); box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-login button {
      background: var(--gx-green); border: 1px solid var(--gx-green); color: var(--gx-green-ink);
      font-weight: 700; font-family: inherit; font-size: 13px;
      padding: 9px 14px; border-radius: var(--gx-radius); cursor: pointer; margin-top: 2px;
    }
    .crew-login button:hover:not(:disabled) { background: var(--gx-green-bright); border-color: var(--gx-green-bright); }
    .crew-login button:disabled { opacity: .55; cursor: default; }
    .crew-error { color: var(--gx-red); font-size: 12px; min-height: 1em; margin: 10px 0 0; }

    /* ── Roster v3: tools, permits, retire ───────────────────────────────── */
    .gx-main { max-width: 1240px; }
    .crew-bar-right { display: inline-flex; align-items: center; gap: 16px; }
    .crew-tools { display: flex; align-items: center; gap: 16px; margin: 0 0 14px; flex-wrap: wrap; }
    .crew-search {
      flex: 1 1 260px; min-width: 200px; background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius);
      color: var(--gx-text); padding: 7px 11px; font: inherit; font-size: 13px; outline: none;
    }
    .crew-search:focus { border-color: var(--gx-green-dim); box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-toggle { display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--gx-text-dim); cursor: pointer; white-space: nowrap; }
    .crew-toggle input { accent-color: var(--gx-green); }

    /* Wide table scrolls inside its own box — the page itself must never scroll sideways. */
    .crew-table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    .crew-table { min-width: 1080px; }
    .crew-num { width: 3.2em; text-align: center; }
    .crew-actions { white-space: nowrap; }
    .crew-retire { margin-left: 10px; font-size: 11px; }
    .crew-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
      color: var(--gx-text-mute); border: 1px solid var(--gx-border-strong);
      border-radius: var(--gx-radius-sm); padding: 1px 5px; margin-left: 6px; }
    tr.is-retired td { opacity: .55; }
    tr.is-retired td b { font-weight: 400; }

    .permit-ok   { color: var(--gx-text-dim); }
    .permit-warn { color: var(--gx-gold); font-weight: 600; }
    .permit-bad  { color: var(--gx-red); font-weight: 700; }
    .crew-banner b { color: inherit; }

    /* ── v5: sortable headers, flagged cells, merge ──────────────────────── */
    .crew-sort { cursor: pointer; user-select: none; white-space: nowrap; }
    .crew-sort:hover { color: var(--gx-text); }
    .crew-sort.is-sorted { color: var(--gx-green); }
    .crew-caret { display: inline-block; width: 1em; font-size: 8px; vertical-align: middle; }

    /* Red = missing or malformed, never merely unusual. Applied to the cell for read-only
       values and to the control itself for editable ones, so the fix is where the eye lands. */
    td.is-flagged { color: var(--gx-red); }
    input.is-flagged, select.is-flagged { border-color: var(--gx-red); color: var(--gx-red); }
    input.is-flagged::placeholder { color: var(--gx-red); opacity: .65; }
    span.is-flagged { color: var(--gx-red); font-weight: 600; }
    tr.is-retired td.is-flagged, tr.is-retired input.is-flagged { color: inherit; border-color: var(--gx-border); }

    .crew-merge { margin-left: 10px; font-size: 11px; }
    tr.is-merge-src { outline: 1px dashed var(--gx-gold); outline-offset: -1px; }
    tr.is-merge-src td { background: var(--gx-gold-soft); }
    .crew-table { min-width: 1320px; }
    .permit-active { color: var(--gx-green); font-weight: 700; letter-spacing: .5px; }
    .crew-permit-no { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; color: var(--gx-text-dim); letter-spacing: .5px; }

    /* ── v7: review queue ────────────────────────────────────────────────── */
    .crew-nav { display: flex; gap: 4px; margin: -4px 0 18px; border-bottom: 1px solid var(--gx-border); }
    .crew-tab { background: none; border: 0; border-bottom: 2px solid transparent;
      color: var(--gx-text-mute); font: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 1.1px; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
    .crew-tab:hover { color: var(--gx-text); }
    .crew-tab.is-active { color: var(--gx-green); border-bottom-color: var(--gx-green); }
    .crew-badge { display: inline-block; margin-left: 7px; padding: 1px 7px;
      border-radius: var(--gx-radius-pill); font-size: 10px; letter-spacing: 0;
      background: var(--gx-gold-soft); color: var(--gx-gold); border: 1px solid var(--gx-gold-line); }
    .crew-badge.is-high { background: var(--gx-red-soft); color: var(--gx-red); border-color: var(--gx-red); }

    .crew-review-intro { font-size: 12px; margin: 0 0 16px; }
    .crew-review-intro b { color: var(--gx-text); }
    .crew-allclear { color: var(--gx-green); font-size: 14px; padding: 18px 0; }

    .crew-review { border: 1px solid var(--gx-border); border-left-width: 3px;
      border-radius: var(--gx-radius-md); padding: 13px 15px; margin: 0 0 10px;
      background: var(--gx-surface-2); transition: opacity .25s; }
    .crew-review-high { border-left-color: var(--gx-red); }
    .crew-review-warn { border-left-color: var(--gx-gold); }
    .crew-review-info { border-left-color: var(--gx-border-strong); }
    .crew-review.is-done { opacity: .4; }

    .crew-review-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .crew-review-head b { color: var(--gx-text); font-size: 14px; }
    .crew-review-kind { font-size: 10px; font-weight: 700; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-review-src { margin-left: auto; font-size: 10px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-review-detail { font-size: 12.5px; color: var(--gx-text-dim); margin: 7px 0 0; line-height: 1.5; }

    .crew-review-cmp { display: flex; align-items: stretch; gap: 12px; margin: 11px 0 0; flex-wrap: wrap; }
    .crew-review-col { display: flex; flex-direction: column; gap: 3px; font-size: 13px;
      color: var(--gx-text-dim); background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius); padding: 6px 11px; }
    .crew-review-col em { font-size: 9.5px; font-style: normal; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-review-col.is-proposed { color: var(--gx-green); border-color: var(--gx-green-dim); }
    .crew-review-arrow { align-self: center; color: var(--gx-text-mute); }

    .crew-review-acts { display: flex; align-items: center; gap: 8px; margin: 13px 0 0; flex-wrap: wrap; }
    .crew-save.is-primary { background: var(--gx-green); border-color: var(--gx-green);
      color: var(--gx-green-ink); font-weight: 700; }
    .crew-save.is-primary:hover:not(:disabled) { background: var(--gx-green-bright); }
  </style>
</head>
<body class="gx-app">
  <header class="gx-topbar">
    <span class="gx-wordmark">GX&nbsp;<b>Crew</b></span>
    <span class="gx-topbar-sub">HR &amp; People</span>
  </header>
  <main id="app" class="gx-main"><!-- rendered by crew.js --></main>
  <!-- ?v=N is the single source of truth deploy.sh reads for the version. Bump on each ship. -->
  <script src="crew.js?v=7"></script>
</body>
</html>
