<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Icons: shared from gx-theme, absolute, so every app is identical and nothing is copied per
       repo. Two DIFFERENT images on purpose:
         favicon          GREEN mark on TRANSPARENT. A tab strip is light or dark depending on the
                          browser and the OS theme, so an icon with its own background tile only ever
                          matches one of them. Alpha lets the mark sit on whatever the strip is.
         apple-touch-icon the GC-3D-BUTTON pack (Dark) at 180x180 — a different pack from the icon
                          one, because the button artwork IS a rounded tile, which is what a home
                          screen icon is. FULL-BLEED and FULLY OPAQUE: iOS discards the alpha channel
                          and composites what is left on WHITE (not black — that cost two wrong ships
                          to establish), so any transparent inset becomes a white frame.
       The old per-app touch icons were 1254x1254 / ~2.8MB -- roughly 7x more resolution than iOS
       ever uses, downloaded on every page load. -->
  <link rel="icon" type="image/png" href="https://greencrosscanna.github.io/greencross-gx-theme/gc-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://greencrosscanna.github.io/greencross-gx-theme/gc-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="https://greencrosscanna.github.io/greencross-gx-theme/gc-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="https://greencrosscanna.github.io/greencross-gx-theme/gc-touch-icon-152.png">
  <!-- Home-screen install: without these iOS opens the app in Safari chrome
       rather than standalone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Green Cross">
  <meta name="theme-color" content="#0a0e0d">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GX Crew</title>
  <!-- Shared GX runtime (theme + resilient GX Core client) — same-origin org Pages -->
  <link rel="stylesheet" href="https://greencrosscanna.github.io/greencross-gx-theme/gx-theme.css">
  <!-- The shared avatar builder. OPT-IN by design: it is its own css/js pair rather than part of
       gx-theme.css, so only the apps that link it are affected by it. Crew and Leaderboard both do.
       Do NOT copy these rules into the block below to "fix" a colour — a local override of a shared
       component is how the suite grew six different login screens. Send core-admin a note instead. -->
  <!-- GX dev-guard bootstrap. Canonical source: greencross-gx-theme/gx-dev-boot.html.
     Paste this ONCE in <head>, before the app's own scripts. It replaces the old
     <script src="gx-dev.js"></script> tag, which had two problems in production:

       1. It requested a file on EVERY page load, including kiosks. If the file was not committed in
          that repo it 404ed every time (this is what happened in Leaderboard v1.506); if it was, the
          kiosk downloaded a dev-only script it can never use.
       2. A RELATIVE src cannot resolve on a GAS-served page -- HtmlService sandboxes the document to a
          different origin -- so on that path the guard was silently ABSENT rather than inert. Nothing
          signalled it, which is worse than the 404.

     Loading it only on localhost fixes both: production never makes the request at all, and the URL is
     absolute so it resolves from any origin, GAS included. Nothing to commit per repo, which also
     removes the "referenced a file I never tracked" failure entirely. -->
<script>
(function () {
  var h = location.hostname;
  if (!(h === 'localhost' || h === '127.0.0.1' || h === '::1' ||
        /^192\.168\./.test(h) || /^10\./.test(h))) return;   // production: do nothing at all
  var s = document.createElement('script');
  s.src = 'https://greencrosscanna.github.io/greencross-gx-theme/gx-dev.js';
  s.async = false;   // keep execution order relative to other injected scripts
  document.head.appendChild(s);
})();
</script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-client.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-topnav.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-changelog.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-stores.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-avatar.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-bugreport.js"></script>
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-updatecheck.js"></script>
<script>
  // Dev guard: non-mutating actions. Anything NOT listed is blocked when this page is served
  // from localhost, until writes are armed (banner button / ?arm=1 / GXDev.arm()). Inert in
  // production. Add new READS here; leave writes off the list.
  // Guarded writes: review_resolve, roster_identity, roster_merge, roster_retire, roster_save
  window.GX_DEV_READS = [
    'config', 'login', 'review', 'roster', 'stores'
  ];
</script>
  <style>
    /* Shell layout only. Every colour comes from gx-theme.css tokens — never hardcode one here,
       or the app drifts out of the suite's look the next time the theme moves.

       The three shades below are the ONLY exception, and each is a half-step the shared palette
       does not carry: the people rail sits between --gx-bg and --gx-surface, the group count sits
       between --gx-text-mute and --gx-border-strong, and the section rule is a quieter
       --gx-border. They are declared ONCE here rather than inlined at every use, and they stay
       app-local on purpose — a rail shade is Crew's own character, not something all six apps
       should inherit. Everything else below resolves to a --gx-* token. */
    .gx-app { --crew-rail: #0d1211; --crew-count: #3d4744; --crew-rule: #1c2320; }

    body { margin: 0; min-height: 100vh; font-size: 15px; }
    .gx-wordmark b { color: var(--gx-green); }
    .gx-main { padding: 28px 20px; max-width: 1240px; margin: 0 auto; }
    .gx-card { padding: 22px; }
    .gx-card h1 { margin: 0 0 6px; font-size: 20px; color: var(--gx-text); }
    .gx-muted { color: var(--gx-text-dim); }
    code { background: var(--gx-surface-3); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-sm); padding: 1px 5px; font-size: .9em; }

    /* ── Workspace shell ──────────────────────────────────────────────────────
       The roster is the one view that owns the whole viewport: two panes that scroll
       independently, and a page that never scrolls at all. Login and the status card still
       render into the same #app, so the full-height rules are gated behind a class the roster
       adds and every other view removes — otherwise the login card would be pinned inside a
       flex column it was never designed for. */
    body.crew-ws { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    body.crew-ws .gx-topnav { flex: none; }
    #app.is-ws { flex: 1 1 auto; min-height: 0; max-width: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; }

    /* ── Sub nav: the roster's own controls ─────────────────────────────────── */
    .crew-subnav { display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
      padding: 9px 18px; background: var(--gx-surface);
      border-bottom: 1px solid var(--gx-border); flex: none; }

    .crew-searchwrap { position: relative; flex: 1 1 320px; max-width: 460px; }
    .crew-search { width: 100%; box-sizing: border-box; background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius-md);
      color: var(--gx-text); padding: 7px 12px 7px 32px; font: inherit; font-size: 13px;
      outline: none; }
    .crew-search:focus { border-color: var(--gx-green-dim); box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-searchico { position: absolute; left: 11px; top: 7px; color: var(--gx-text-mute);
      font-size: 13px; pointer-events: none; }

    /* Segmented scope. One control with three exclusive states, replacing three loose
       checkboxes that could be combined into readings nobody meant (retired AND flagged). */
    .crew-seg { display: flex; background: var(--gx-surface-2); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-md); padding: 2px; }
    .crew-seg-btn { border: 0; border-radius: var(--gx-radius); padding: 6px 12px;
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      background: transparent; color: var(--gx-text-dim); }
    .crew-seg-btn:hover:not(.is-on) { color: var(--gx-text); }
    .crew-seg-btn.is-on { background: var(--gx-border); color: var(--gx-text); }
    .crew-seg-btn:focus-visible { outline: 2px solid var(--gx-green); outline-offset: 1px; }

    .crew-div { width: 1px; height: 22px; background: var(--gx-border); flex: none; }

    /* Store filter pills. App-local on purpose: gx-theme's .gx-pill is a static status badge
       (uppercase, letterspaced, not clickable) and this is an interactive filter control, so this
       is a NEW class rather than a local override of a shared one — overriding is how the suite
       ends up with six different versions of the same component. --crew-pill-color is set inline
       per pill from the GX Core store registry via GXStores, with a neutral fallback for stores
       that carry no colour (corporate). */
    .crew-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .crew-pills-slot { display: contents; }
    .crew-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius-pill);
      background: var(--gx-surface-2); color: var(--gx-text-dim);
      font: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.4;
      cursor: pointer; white-space: nowrap; }
    .crew-pill:hover { color: var(--gx-text); }
    .crew-pill:focus-visible { outline: 2px solid var(--gx-green); outline-offset: 2px; }
    .crew-pill-dot { width: 6px; height: 6px; border-radius: 50%; flex: none;
      background: var(--crew-pill-color, var(--gx-text-mute)); }
    .crew-pill.is-on { color: var(--gx-text); border-color: var(--crew-pill-color, var(--gx-green)); }
    /* Dim, never disappear: a pill row that reflows under the cursor is how you click the
       wrong store. */
    .crew-pill.is-empty { opacity: .45; }
    .crew-pill-n { color: var(--gx-text-mute); font-variant-numeric: tabular-nums; }

    /* ── Two panes ────────────────────────────────────────────────────────────
       Each scrolls on its own; the page never does, and nothing scrolls sideways. */
    .crew-body { flex: 1 1 auto; display: flex; min-height: 0; }

    .crew-rail { width: 340px; flex: none; border-right: 1px solid var(--gx-border);
      background: var(--crew-rail); overflow-y: auto; min-height: 0; padding: 6px 0 40px; }
    .crew-group-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px;
      position: sticky; top: 0; background: var(--crew-rail); z-index: 1; }
    .crew-group-dot { width: 6px; height: 6px; border-radius: 50%; flex: none;
      background: var(--crew-group-color, var(--gx-text-mute)); }
    .crew-group-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-group-n { margin-left: auto; font-size: 10.5px; color: var(--crew-count);
      font-variant-numeric: tabular-nums; }

    .crew-person { display: flex; align-items: center; gap: 10px; width: 100%;
      box-sizing: border-box; text-align: left; border: 0; border-left: 2px solid transparent;
      background: transparent; cursor: pointer; padding: 7px 14px 7px 12px; font: inherit; }
    .crew-person:hover { background: var(--gx-surface-2); }
    .crew-person.is-sel { border-left-color: var(--gx-green); background: var(--gx-surface-2); }
    .crew-person.is-retired { opacity: .6; }
    .crew-person:focus-visible { outline: 2px solid var(--gx-green); outline-offset: -2px; }
    .crew-person-txt { min-width: 0; flex: 1 1 auto; }
    .crew-person-name { display: block; font-size: 13px; font-weight: 600; color: var(--gx-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crew-person-name.is-blank { color: var(--gx-red); }
    .crew-person-meta { display: block; font-size: 11px; color: var(--gx-text-mute);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crew-person-star { flex: none; color: var(--gx-gold); font-size: 12px; }
    .crew-person-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
    .crew-rail-empty { padding: 20px 14px; margin: 0; font-size: 12.5px; color: var(--gx-text-mute); }
    /* A skeleton, not an empty pane: an empty roster reads as "nobody works here". */
    .crew-skel { height: 42px; margin: 2px 12px; border-radius: var(--gx-radius-md);
      background: var(--gx-surface-2); opacity: .5; animation: crew-pulse 1.4s ease-in-out infinite; }
    @keyframes crew-pulse { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }

    .crew-pane { flex: 1 1 auto; overflow-y: auto; min-height: 0; background: var(--gx-bg); }

    /* ── Shared small parts ───────────────────────────────────────────────── */
    .crew-btn { background: transparent; color: var(--gx-text-dim);
      border: 1px solid var(--gx-border-strong); border-radius: var(--gx-radius);
      padding: 5px 11px; font: inherit; font-size: 11.5px; cursor: pointer;
      transition: color .15s, border-color .15s; }
    .crew-btn:hover:not(:disabled) { color: var(--gx-text); border-color: var(--gx-green); }
    .crew-btn:disabled { opacity: .45; cursor: default; }
    .crew-btn.is-primary { background: var(--gx-green); border-color: var(--gx-green);
      color: var(--gx-green-ink); font-weight: 700; }
    .crew-btn.is-primary:hover:not(:disabled) { background: var(--gx-green-bright);
      border-color: var(--gx-green-bright); color: var(--gx-green-ink); }
    .crew-btn.is-gold { color: var(--gx-gold); border-color: var(--gx-gold-line); }
    .crew-btn.is-gold:hover:not(:disabled) { color: var(--gx-gold); border-color: var(--gx-gold); }
    .crew-btn.is-danger { color: var(--gx-red); }
    .crew-btn.is-danger:hover:not(:disabled) { color: var(--gx-red); border-color: var(--gx-red); }

    .crew-sect { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
    .crew-sect:first-child { margin-top: 0; }
    .crew-sect h2 { margin: 0; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--gx-text-dim); font-weight: 700; }
    .crew-sect span { font-size: 11px; color: var(--gx-text-mute); }
    .crew-hint { font-size: 11px; color: var(--gx-text-mute); }
    .crew-save-status { margin-left: 8px; font-size: 11px; color: var(--gx-text-mute); }
    .crew-save-status.ok  { color: var(--gx-green); }
    .crew-save-status.err { color: var(--gx-red); }

    .crew-banner { padding: 10px 12px; border-radius: var(--gx-radius-md);
      font-size: 12px; margin: 0 0 14px; line-height: 1.5; }
    .crew-banner-warn  { background: var(--gx-gold-soft); border: 1px solid var(--gx-gold-line);
      color: var(--gx-gold); }
    .crew-banner-error { background: var(--gx-red-soft); border: 1px solid var(--gx-red);
      color: var(--gx-red); }
    .crew-banner b { color: inherit; }

    /* ── Overview pane ───────────────────────────────────────────────────────
       Where the Review and EoM tabs went: everything that needs a decision, in one place,
       shown whenever nobody is selected. */
    .crew-ov { padding: 26px 30px 60px; max-width: 900px; }
    .crew-ov-h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.3px;
      color: var(--gx-text); }
    .crew-ov-sub { margin: 5px 0 22px; font-size: 13px; color: var(--gx-text-mute); }

    .crew-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; margin: 0 0 26px; }
    .crew-stat { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg); padding: 14px 16px; }
    .crew-stat-n { font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -.4px; color: var(--gx-text); }
    .crew-stat-n.is-warn { color: var(--gx-gold); }
    .crew-stat-n.is-bad  { color: var(--gx-red); }
    .crew-stat-n.is-ok   { color: var(--gx-green); }
    .crew-stat-l { font-size: 11px; color: var(--gx-text-mute); margin-top: 2px; letter-spacing: .3px; }

    /* One open question. Severity rides the left edge only — the card itself stays neutral so a
       queue of ten does not read as ten alarms. */
    .crew-q { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px;
      background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-left: 3px solid var(--gx-border-strong);
      border-radius: 9px; padding: 12px 14px; margin: 0 0 8px; }
    .crew-q.sev-high { border-left-color: var(--gx-red); }
    .crew-q.sev-warn { border-left-color: var(--gx-gold); }
    /* Wide enough for the longest store-and-role pairing on one line — "Commercial · Assistant
       Manager" is 9.5px uppercase with letter-spacing, which is wider than it looks. It wrapped
       to two lines at the original 190px and pushed the card taller than its neighbours. */
    .crew-q-who { display: flex; align-items: center; gap: 9px; background: none; border: 0;
      padding: 0; cursor: pointer; flex: 0 1 260px; min-width: 240px; text-align: left; font: inherit; }
    .crew-q-txt { min-width: 0; }
    .crew-q-name { display: block; font-size: 13px; font-weight: 600; color: var(--gx-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crew-q-kind { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .9px;
      text-transform: uppercase; color: var(--gx-border-strong);
      /* One line, always. If a pairing ever outgrows the column it clips rather than reflowing —
         a card that changes height on a long store name breaks the rhythm of the whole list. */
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crew-q.sev-high .crew-q-kind { color: var(--gx-red); }
    .crew-q.sev-warn .crew-q-kind { color: var(--gx-gold); }
    .crew-q-detail { flex: 1 1 240px; min-width: 180px; font-size: 12.5px;
      color: var(--gx-text-dim); line-height: 1.45; }
    .crew-q-acts { flex: 0 0 auto; margin-left: auto; display: flex; align-items: center;
      gap: 7px; white-space: nowrap; }
    .crew-q.is-done { opacity: .35; }
    /* A newcomer reuses the question card's shape — same row, same reading order — but carries a
       green edge rather than a severity colour. Nothing is wrong with these records; they are
       simply unfinished, and colouring them like a problem would spend the queue's alarm budget
       on paperwork. */
    .crew-q.crew-new { border-left-color: var(--gx-green); }
    .crew-q.crew-new .crew-q-kind { color: var(--gx-text-mute); }
    .crew-clear { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg); padding: 26px; text-align: center;
      font-size: 13.5px; color: var(--gx-green); }

    .crew-eomcard { background: var(--gx-surface); border: 1px solid var(--gx-gold-line);
      border-radius: var(--gx-radius-lg); padding: 16px 18px; display: flex;
      align-items: center; gap: 16px; }
    .crew-eomcard-txt { flex: 1 1 auto; min-width: 0; }
    .crew-eomcard-name { font-size: 15px; font-weight: 700; color: var(--gx-text); }
    .crew-eomcard-sub { font-size: 12px; color: var(--gx-text-dim); margin-top: 1px; }

    /* The reign log. A list rather than a table: three facts per reign, and a table's rules
       would carry more weight than the content does. */
    .crew-eomlog { list-style: none; margin: 10px 0 0; padding: 0; }
    .crew-eomlog-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px;
      border-bottom: 1px solid var(--crew-rule); font-size: 12.5px; }
    .crew-eomlog-row:last-child { border-bottom: 0; }
    .crew-eomlog-name { color: var(--gx-text); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0; }
    /* A deliberate "nobody" is part of the record, not a gap in it. */
    .crew-eomlog-name.is-nobody { color: var(--gx-text-mute); font-style: italic; }
    .crew-eomlog-when { margin-left: auto; color: var(--gx-text-dim); white-space: nowrap; }
    .crew-eomlog-by { font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
      color: var(--gx-text-mute); width: 88px; text-align: right; white-space: nowrap; }

    /* ── Person record ───────────────────────────────────────────────────── */
    .crew-phead { padding: 24px 30px 18px; border-bottom: 1px solid var(--crew-rule);
      background: var(--crew-rail); }
    .crew-phead-in { display: flex; align-items: flex-start; gap: 16px; max-width: 900px; }
    .crew-phead-txt { flex: 1 1 auto; min-width: 0; }
    .crew-pnamerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    /* A heading, not an input. It renders NICKNAME + SURNAME — two stored fields joined — so
       there is nothing here that could be saved back; the legal name and the nickname are edited
       as their own cards in the grid below. See displayName() in crew.js. */
    .crew-pname { color: var(--gx-text); font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
    .crew-pname.is-blank { color: var(--gx-red); }
    /* The legal first name, in green quotes beside it — the spelling METRC and payroll use, kept
       visible so the roster can lead with the name people actually say without hiding the other. */
    .crew-pnick { color: var(--gx-green); font-size: 14px; }
    .crew-pnick:empty { display: none; }
    .crew-pmeta { display: flex; align-items: center; gap: 9px; margin-top: 6px;
      flex-wrap: wrap; font-size: 12.5px; color: var(--gx-text-dim); }
    .crew-pmeta-sep { color: var(--gx-border-strong); }
    .crew-pmeta-store { display: inline-flex; align-items: center; gap: 6px; }
    .crew-pmeta-dot { width: 7px; height: 7px; border-radius: 50%;
      background: var(--crew-store-color, var(--gx-border-strong)); }
    .crew-pmeta-num { font-variant-numeric: tabular-nums; }
    .crew-pacts { flex: none; display: flex; align-items: center; gap: 8px; }
    .crew-eomtog { border-radius: var(--gx-radius-pill); padding: 6px 12px; font-size: 11.5px;
      font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
      color: var(--gx-text-mute); border-color: var(--gx-border-strong); }
    .crew-eomtog.is-on { background: var(--gx-gold-soft); border-color: var(--gx-gold);
      color: var(--gx-gold); }
    .crew-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      color: var(--gx-text-mute); border: 1px solid var(--gx-border-strong);
      border-radius: var(--gx-radius-sm); padding: 2px 6px; }

    .crew-pbody { padding: 20px 30px 70px; max-width: 900px; }

    /* This person's open questions, answered where the record is being read. */
    .crew-pq { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-left: 3px solid var(--gx-border-strong); border-radius: 9px;
      padding: 13px 15px; margin: 0 0 8px; }
    .crew-pq.sev-high { border-left-color: var(--gx-red); border-color: rgba(239, 68, 68, .35); }
    .crew-pq.sev-warn { border-left-color: var(--gx-gold); border-color: var(--gx-gold-soft); }
    .crew-pq-head { display: flex; align-items: baseline; gap: 10px; }
    .crew-pq-kind { font-size: 9.5px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gx-border-strong); }
    .crew-pq.sev-high .crew-pq-kind { color: var(--gx-red); }
    .crew-pq.sev-warn .crew-pq-kind { color: var(--gx-gold); }
    .crew-pq-src { margin-left: auto; font-size: 10px; letter-spacing: .9px;
      text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-pq-detail { margin: 6px 0 0; font-size: 12.5px; color: var(--gx-text-dim); line-height: 1.5; }
    .crew-pq-cmp { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; flex-wrap: wrap; }
    .crew-pq-chip { font-size: 13px; color: var(--gx-text-dim); background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius); padding: 5px 10px; }
    .crew-pq-chip.is-proposed { color: var(--gx-green); border-color: var(--gx-green-dim); }
    .crew-pq-arrow { color: var(--gx-text-mute); }
    .crew-pq-acts { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }

    /* One card per field. A missing value borders gold and says what is missing in its own
       note — red is reserved for damage, and an unfilled shirt size is not damage. */
    .crew-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px; margin: 0 0 22px; }
    .crew-field { display: flex; flex-direction: column; gap: 5px; background: var(--gx-surface);
      border: 1px solid var(--gx-border); border-radius: 9px; padding: 11px 13px; }
    .crew-field.is-gap { border-color: var(--gx-gold-line); }
    .crew-field-label { font-size: 9.5px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gx-text-mute); cursor: pointer; }
    .crew-field input, .crew-field select { background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius); color: var(--gx-text);
      padding: 7px 9px; font: inherit; font-size: 13.5px; outline: none; width: 100%;
      box-sizing: border-box; color-scheme: dark; }
    .crew-field input:focus, .crew-field select:focus { border-color: var(--gx-green-dim);
      box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-field input:disabled { color: var(--gx-text-mute); cursor: default; }
    .crew-field-note { font-size: 10.5px; color: var(--gx-text-mute); min-height: 13px; }
    .crew-field.is-gap .crew-field-note { color: var(--gx-gold); }
    .crew-field-note.is-bad { color: var(--gx-red); }
    .crew-field-note.is-saved { color: var(--gx-green); }

    /* A trailer under a field's note — today only the wage card's "Not on payroll". Deliberately
       quiet: it is the exception, not the control you reach for every time. */
    .crew-field-toggle { display: flex; align-items: center; gap: 7px; margin-top: 1px; }
    .crew-field-toggle select { background: transparent; border: 0; color: var(--gx-text-mute);
      font: inherit; font-size: 10.5px; padding: 0; outline: none; cursor: pointer;
      color-scheme: dark; }
    .crew-field-toggle select:hover:not(:disabled) { color: var(--gx-text-dim); }
    .crew-field-toggle select:focus { color: var(--gx-text); }
    .crew-permit { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg); padding: 16px 18px; }
    .crew-permit.is-bad { border-color: rgba(239, 68, 68, .4); }
    .crew-permit-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .crew-permit-no { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; letter-spacing: .5px; color: var(--gx-text); }
    .crew-permit-pill { font-size: 11px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; border: 1px solid currentColor;
      border-radius: var(--gx-radius-pill); padding: 2px 10px; }
    /* The two inputs that appear only when there is no permit on file — see permitCard(). */
    .crew-permit-in { flex: 0 1 170px; background: var(--gx-surface-3);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius); color: var(--gx-text);
      padding: 6px 9px; font: inherit; font-size: 13px; outline: none; color-scheme: dark; }
    .crew-permit-in.is-no { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .5px; }
    .crew-permit-in:focus { border-color: var(--gx-green-dim); box-shadow: 0 0 0 3px var(--gx-green-soft); }
    .crew-permit-line { margin-left: auto; font-size: 12.5px; color: var(--gx-text-dim); }
    .crew-permit-bar { height: 4px; border-radius: var(--gx-radius-pill);
      background: var(--gx-surface-3); margin: 13px 0 0; overflow: hidden; }
    .crew-permit-fill { height: 100%; }
    .is-ok   { color: var(--gx-green); }
    .is-warn { color: var(--gx-gold); }
    .is-bad-t { color: var(--gx-red); }

    .crew-links { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg); padding: 14px 18px; }
    .crew-linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
    .crew-linkpill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
      color: var(--gx-text); background: var(--gx-surface-3); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-pill); padding: 4px 11px; }
    .crew-linkpill.is-warn { color: var(--gx-gold); }
    .crew-linkpill.is-bad  { color: var(--gx-red); }
    .crew-linkpill-l { font-size: 9.5px; font-weight: 700; letter-spacing: .8px;
      text-transform: uppercase; color: var(--gx-text-mute); }
    .crew-linknote { margin: 11px 0 0; font-size: 11.5px; color: var(--gx-text-mute); line-height: 1.55; }
    .crew-celeb { display: flex; align-items: center; gap: 9px; margin: 13px 0 0;
      font-size: 12.5px; color: var(--gx-text-dim); cursor: pointer; }
    .crew-celeb input { accent-color: var(--gx-green); }

    .crew-pfoot { display: flex; align-items: center; gap: 10px; margin: 24px 0 0;
      padding-top: 16px; border-top: 1px solid var(--crew-rule); }
    .crew-pfoot .crew-btn { padding: 7px 13px; font-size: 12px; }
    .crew-pfoot-right { margin-left: auto; }

    /* Merge chooser. Merging is picking the OTHER record, so it is a search over people rather
       than a two-click dance across a table that no longer exists. */
    .crew-mergebox { margin: 12px 0 0; background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg); padding: 14px 16px; }
    .crew-mergelist { max-height: 240px; overflow-y: auto; margin: 10px 0 0; }
    .crew-mergerow { display: flex; align-items: center; gap: 10px; width: 100%;
      box-sizing: border-box; text-align: left; background: transparent; border: 0;
      border-bottom: 1px solid var(--crew-rule); padding: 7px 4px; font: inherit;
      font-size: 12.5px; color: var(--gx-text); cursor: pointer; }
    .crew-mergerow:hover { background: var(--gx-surface-2); }
    .crew-mergerow em { margin-left: auto; font-style: normal; font-size: 11px;
      color: var(--gx-text-mute); }

    /* ── Toast ────────────────────────────────────────────────────────────────
       Save confirmation. Every control is live, so this is the only thing that says a write
       landed — it names the field rather than saying "Saved", because on a screen of twenty
       inputs "Saved" does not tell you which one. */
    .crew-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 60; background: var(--gx-surface-2); border: 1px solid var(--gx-green-dim);
      border-radius: var(--gx-radius-pill); padding: 8px 18px; font-size: 12.5px;
      color: var(--gx-green); box-shadow: var(--gx-shadow); display: flex; align-items: center; gap: 12px; }
    .crew-toast.is-err { border-color: var(--gx-red); color: var(--gx-red); }
    .crew-toast button { background: none; border: 0; color: inherit; font: inherit;
      font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }

    /* ── Avatars ──────────────────────────────────────────────────────────────
       The puck is the rendered DiceBear face, or initials when nobody has picked one. Faces come
       from an external service, so a failed load falls back to initials rather than a broken image. */
    .crew-ava { position: relative; width: 28px; height: 28px; flex: none; border-radius: 50%;
      overflow: hidden; background: var(--gx-surface-3); border: 1px solid var(--gx-border-strong);
      display: flex; align-items: center; justify-content: center; }
    .crew-ava img { width: 100%; height: 100%; display: block; }
    .crew-ava.is-initials { font-size: 9.5px; font-weight: 700; color: var(--gx-text-dim); }
    /* The GC hat is an overlay on top of the DiceBear face, sized to the same 280x280 viewBox. */
    .crew-ava-hat { position: absolute; inset: 0; pointer-events: none; }
    .crew-ava-hat svg { width: 100%; height: 100%; display: block; }
    .crew-ava.is-md { width: 48px; height: 48px; border-color: var(--gx-gold); }
    .crew-ava.is-md.is-initials { font-size: 15px; }
    .crew-ava.is-xl { width: 62px; height: 62px; }
    .crew-ava.is-xl.is-initials { font-size: 19px; }
    .crew-ava.is-lg { width: 96px; height: 96px; }
    .crew-ava.is-lg.is-initials { font-size: 30px; }

    .crew-nick { color: var(--gx-green); font-size: 12px; }
    /* A blanked identity row. Red rather than muted on purpose: this is damage to the
       record, not a field somebody has not filled in yet. */
    .crew-noname { color: var(--gx-red); }

    /* ── Avatar picker ──────────────────────────────────────────────────────
       Crew's own 105-line picker was RETIRED on 2026-08-25, not merged — the Leaderboard one is
       the one Sky wants everywhere ("the current, simplified version in Crew is efficient but not
       intuitive and just adds noise"). What is left here is the two things that are genuinely
       Crew's: the button that WRAPS the record's avatar circle, and the box the shared component
       mounts into. Everything inside it is .gxava-*, styled by gx-avatar-picker.css.

       NOTE the mount host does NOT carry .gxava-full — that class assumes it owns the viewport
       (min-height:100vh) and this is a panel inside a record. */
    .crew-avabtn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
      border-radius: 50%; line-height: 0; flex: none; }
    .crew-avabtn:hover .crew-ava { border-color: var(--gx-green); }
    .crew-avabtn:focus-visible { outline: 2px solid var(--gx-green); outline-offset: 2px; }
    .crew-avabtn[disabled] { cursor: default; }
    .crew-avabtn[disabled]:hover .crew-ava { border-color: var(--gx-border-strong); }
    .crew-avamount { margin: 12px 0 0; background: var(--gx-surface);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius-lg); overflow: hidden; }
/* Shown while GXAvatar.loadPicker() fetches the builder. The picker is no longer on the page at
   load, so there IS a moment between the click and the editor — say so rather than showing an
   empty box, which reads as a broken button. */
.crew-avaloading { padding: 28px 20px; color: var(--text-dim, #a8aba6); font-size: 13px; }


    /* Desktop only, per the brief. Below ~1100px the sub nav wraps; the rail stays 340px so
       the two panes never fight over the same space. */
    @media (max-width: 1100px) {
      .crew-ov, .crew-pbody, .crew-phead-in { max-width: none; }
    }

    /* ── Incentive ────────────────────────────────────────────────────────────────
       Rebuilt to design_handoff_incentive_polish (2026-08-28). Same three tables, same
       columns, same math, same routes — what changed is that it stops reading like the
       spreadsheet it was ported from and starts reading like a payout screen.

       THE HIGHLIGHT BUDGET IS THE POINT. Five columns used to go green at once and Payroll
       was green too, so nothing stood out. Now a MET target is --gx-green at 600 and a MISSED
       one recedes to --gx-text-dim; PAYROLL alone gets weight 700, a tinted column and a green
       header, because it is the only figure the Capstone export carries.

       Every colour is a --gx-* token. The specificity trap still applies to every one of them:
       `.crew-inc-tbl td` is (0,1,1), so a bare `.crew-inc-hit` loses and paints nothing. */
    .crew-inc { flex: 1 1 auto; overflow-y: auto; min-height: 0; background: var(--gx-bg); }

    /* Header band — title, state, period, actions and totals, off the tables. */
    .crew-inc-band { background: var(--crew-rail); border-bottom: 1px solid var(--gx-border);
      padding: 16px 22px 18px; }
    .crew-inc-head { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
    .crew-inc-headl { display: flex; flex-direction: column; gap: 9px; }
    .crew-inc-titlerow { display: flex; align-items: center; gap: 10px; }
    .crew-inc-title { font-size: 20px; font-weight: 700; letter-spacing: -.3px; color: var(--gx-text); }
    .crew-inc-badge { display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; }
    .crew-inc-badge.is-live { background: #14251c; color: var(--gx-green); border: 1px solid #24503a; }
    .crew-inc-badge.is-imported { background: #2a2118; color: #e0a458; border: 1px solid #4a3a24; }
    .crew-inc-dotlive { width: 6px; height: 6px; border-radius: 50%; background: var(--gx-green); }
    .crew-inc-sub { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* One bordered group: ‹ · select · › — the arrows step the same array the select holds. */
    .crew-inc-per { display: inline-flex; align-items: stretch; background: var(--gx-surface-2);
      border: 1px solid var(--gx-border); border-radius: var(--gx-radius-md, 8px); overflow: hidden; }
    .crew-inc-per select { background: transparent; border: 0; color: var(--gx-text);
      font-size: 13px; font-weight: 600; padding: 6px 8px; font-family: inherit; outline: none; }
    .crew-inc-nav { background: none; border: 0; color: var(--gx-text-dim); cursor: pointer;
      padding: 6px 10px; font-size: 13px; font-family: inherit; }
    .crew-inc-nav.l { border-right: 1px solid var(--gx-border); }
    .crew-inc-nav.r { border-left: 1px solid var(--gx-border); }
    .crew-inc-nav:disabled { color: var(--gx-border-strong); cursor: default; }
    .crew-inc-facts { font-size: 12px; color: var(--gx-text-mute); }
    .crew-inc-spacer { flex: 1 1 auto; }
    .crew-inc-actions { display: flex; gap: 8px; align-items: flex-start; }
    .crew-inc-actions .gx-btn { padding: 8px 14px; border-radius: 7px; font-size: 12.5px; }
    .crew-inc-gear { width: 34px; height: 34px; padding: 0; display: flex;
      align-items: center; justify-content: center; font-size: 15px; }
    .crew-inc-wait { font-size: 12.5px; color: var(--gx-text-mute); align-self: center; }

    /* Totals as tiles, the same shape the roster overview uses. */
    .crew-inc-tot { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 10px; max-width: 820px; margin: 16px 0 0; }
    .crew-inc-tot div { background: var(--gx-surface); border: 1px solid var(--gx-border);
      border-radius: var(--gx-radius-lg, 10px); padding: 12px 14px; }
    .crew-inc-tot dd { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.4px;
      font-variant-numeric: tabular-nums; color: var(--gx-text); }
    .crew-inc-tot dt { margin: 3px 0 0; font-size: 10.5px; color: var(--gx-text-mute);
      text-transform: uppercase; letter-spacing: .06em; }
    .crew-inc-tot .is-total { border-color: #24503a; }
    .crew-inc-tot .is-total dd { color: var(--gx-green); }

    .crew-inc-body { padding: 20px 22px 60px; }
    .crew-inc-sec { display: flex; align-items: center; gap: 9px; margin: 22px 0 8px; }
    .crew-inc-sec:first-child { margin-top: 0; }
    .crew-inc-sec b { font-size: 11.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--gx-text-dim); }
    .crew-inc-seccount { font-size: 11.5px; color: var(--gx-text-mute); }
    .crew-inc-group { margin-left: auto; background: var(--gx-surface-2);
      border: 1px solid var(--gx-border-strong); border-radius: 999px; padding: 5px 12px;
      font-size: 11.5px; font-weight: 600; color: var(--gx-text-dim); cursor: pointer;
      font-family: inherit; }
    .crew-inc-group.is-on { color: var(--gx-text); }

    .crew-inc-wrap { overflow: hidden; border: 1px solid var(--gx-border); border-radius: 9px;
      background: var(--crew-rail); }
    .crew-inc-tbl { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12.5px; }
    .crew-inc-tbl th { padding: 9px 12px; font-size: 10.5px; font-weight: 700; text-align: right;
      text-transform: uppercase; letter-spacing: .07em; color: var(--gx-text-mute);
      background: var(--gx-surface); border-bottom: 1px solid var(--gx-border);
      position: sticky; top: 0; z-index: 1; box-sizing: border-box; }
    .crew-inc-tbl th.l, .crew-inc-tbl td.l { text-align: left; }
    .crew-inc-tbl th.c, .crew-inc-tbl td.c { text-align: center; }
    .crew-inc-tbl td { padding: 9px 12px; text-align: right; color: var(--gx-text);
      border-bottom: 1px solid var(--crew-rule); font-variant-numeric: tabular-nums;
      box-sizing: border-box; }
    .crew-inc-tbl tr:last-child td { border-bottom: 0; }
    .crew-inc-tbl tbody tr:hover td { background: #121917; }
    /* Two vertical rules: identity | performance | money. */
    .crew-inc-tbl th.rule { border-left: 1px solid var(--gx-border); }
    .crew-inc-tbl td.rule { border-left: 1px solid var(--crew-rule); }
    .crew-inc-name { font-weight: 600; }
    .crew-inc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle; flex: none; }

    /* A met target reads green; a missed one recedes. That contrast IS the information. */
    .crew-inc-tbl td.crew-inc-hit { color: var(--gx-green); font-weight: 600; }
    .crew-inc-tbl td.crew-inc-miss { color: var(--gx-text-dim); font-weight: 400; }
    .crew-inc-tbl td.crew-inc-bar { color: var(--gx-text-mute); }   /* the bar, not the result */
    .crew-inc-tbl td.crew-inc-zero,
    .crew-inc-tbl td .crew-inc-zero { color: var(--gx-text-mute); font-weight: 400; }
    /* PAYROLL is the only figure the export carries, so it is the only one that looks like money. */
    .crew-inc-tbl th.crew-inc-payh { color: var(--gx-green); }
    .crew-inc-tbl td.crew-inc-pay { color: var(--gx-green); font-weight: 700; background: #101614; }
    .crew-inc-tbl td.crew-inc-pay[title] { text-decoration: underline dotted var(--gx-border-strong);
      text-underline-offset: 3px; cursor: help; }
    .crew-inc-tbl td.crew-inc-pay .crew-inc-zero { color: var(--gx-text-mute); font-weight: 400; }
    /* An override is a human decision that replaced a measurement — amber, and never silent. */
    .crew-inc-tbl td.crew-inc-over { color: #eab308; font-weight: 700; }
    .crew-inc-edit, .crew-inc-revert { background: none; border: 0; padding: 0 0 0 6px;
      color: var(--gx-text-mute); cursor: pointer; font-size: 11px; opacity: 0;
      transition: opacity .12s ease; font-family: inherit; }
    .crew-inc-tbl tr:hover .crew-inc-edit, .crew-inc-edit:focus,
    .crew-inc-tbl tr:hover .crew-inc-revert, .crew-inc-revert:focus { opacity: 1; }
    .crew-inc-edit:hover, .crew-inc-revert:hover { color: var(--gx-text); }
    .crew-inc-revert { opacity: .7; color: #eab308; }
    .crew-inc-spiff { width: 62px; text-align: right; background: var(--gx-surface-3);
      border: 1px solid #6b5a1f; border-radius: var(--gx-radius, 6px); color: #eab308;
      padding: 3px 5px; font-size: 12.5px; font-family: inherit; }
    .crew-inc-att { width: 15px; height: 15px; accent-color: var(--gx-green); cursor: pointer; }
    .crew-inc-att:disabled { cursor: default; }
    /* Group rows: the same treatment as the roster rail's sticky store header. */
    .crew-inc-grouprow td { background: #101614; border-top: 1px solid var(--crew-rule);
      border-bottom: 1px solid var(--crew-rule); padding: 7px 12px; }
    .crew-inc-grouplbl { font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: var(--gx-text-dim); }
    .crew-inc-groupn { font-size: 10.5px; color: var(--crew-count); margin-left: 7px; }
    .crew-inc-note { font-size: 12px; color: var(--gx-text-mute); margin: 14px 0 0;
      max-width: 760px; line-height: 1.55; }
    .crew-inc-warn { color: #f0a6a6; }
    .crew-inc-refresh { background: none; border: 1px solid var(--gx-border); border-radius: 5px;
      color: var(--gx-text-dim); font-size: 11.5px; padding: 2px 8px; margin-left: 6px;
      cursor: pointer; font-family: inherit; }
    .crew-inc-refresh:hover { border-color: var(--gx-border-strong); color: var(--gx-text); }
    .crew-inc-refresh:disabled { cursor: default; opacity: .6; }
    .crew-inc-returned { margin: 10px 0 0; padding: 9px 12px; border-radius: 7px;
      background: #2a1f18; border: 1px solid #55402c; color: #e8c9a6; font-size: 12.5px;
      max-width: 760px; line-height: 1.5; }
    .crew-inc-msg { padding: 30px 4px; color: var(--gx-text-mute); font-size: 13.5px; }
    .crew-inc-err { color: #f0a6a6; }
    @media (max-width: 900px) { .crew-inc-wrap { overflow-x: auto; }
      .crew-inc-tbl { min-width: 1100px; } }

    @media print {
      /* Margin only — NOT `size: letter landscape`. Forcing the size rotated the whole page 90°
         against a print dialog set to portrait, so the first real PDF came out sideways: readable
         only by turning your head, and useless as a filed record. Chrome's own Landscape checkbox
         drives it now, which is what the archived Leaderboard PDFs sit upright from. */
      @page { margin: 0.4in; }
      html, body { background: #fff !important; color: #000 !important; }
      /* Everything that is not the report */
      /* gx-bugreport.js names its launcher `gx-bug-fab` / #gxBugFab — NOT the .gx-bugreport-btn
         guessed here first, which is why a bug icon printed in the middle of the budtender table
         on the first real PDF. The overlay is hidden too: it is closed, but a print stylesheet
         should not depend on that. */
      .gx-topnav, .crew-subnav, .crew-rail, .crew-pane,
      .gx-bug-fab, #gxBugFab, #gxBugOverlay, .gx-bug-modal,
      .crew-toast, .crew-inc-actions, #incPeriod, .gxdev-banner,
      .crew-inc-returned, .inc-tray, .inc-tray-back, .crew-inc-gear,
      .crew-inc-nav, .crew-inc-group, .crew-inc-edit, .crew-inc-revert,
      .crew-inc-refresh { display: none !important; }
      /* The two explanatory notes are for somebody reading the screen and deciding. The PDF is a
         payroll record that gets filed — it does not need to be told what Payroll means, and one
         of them pointed at a hover that paper does not have. */
      .crew-inc-note { display: none !important; }
      .crew-body, .crew-inc { display: block !important; overflow: visible !important;
        height: auto !important; padding: 0 !important; background: #fff !important; }
      .crew-inc-title, .crew-inc-sub, .crew-inc-sec, .crew-inc-tbl td, .crew-inc-tot dd {
        color: #000 !important; }
      .crew-inc-sub { font-size: 11px; }
      /* The period has to be legible on paper — on screen it is a <select>, which prints as an
         empty box, so a plain-text twin is revealed here and hidden on screen. */
      .crew-inc-printpp { display: none; }
      @media print { .crew-inc-printpp { display: inline !important; font-weight: 600; } }
      /* Tiles collapse to a plain row on paper — four bordered boxes are screen furniture. */
      .crew-inc-band { background: #fff !important; border-bottom: 1px solid #bbb !important;
        padding: 0 0 10px !important; }
      .crew-inc-body { padding: 0 !important; }
      .crew-inc-tot { display: flex !important; gap: 26px; margin: 10px 0 12px; max-width: none; }
      .crew-inc-tot div { border: 0 !important; background: none !important; padding: 0 !important; }
      .crew-inc-tot dd { font-size: 15px; }
      .crew-inc-tot .is-total dd { color: #000 !important; }
      .crew-inc-badge { border-width: 1px !important; }
      .crew-inc-tot dt { color: #555 !important; }
      .crew-inc-grand, .crew-inc-tbl td.crew-inc-pay { color: #000 !important; }
      /* The green that means "hit a target" is the one colour worth the ink — it is the
         difference between a bonus earned and not, and a grey copy cannot show it. */
      .crew-inc-tbl td.crew-inc-hit { color: #0a7a3d !important; font-weight: 700; }
      .crew-inc-tbl td.crew-inc-zero,
      .crew-inc-tbl td .crew-inc-zero { color: #999 !important; }
      .crew-inc-wrap { overflow: visible !important; border: 1px solid #bbb !important;
        border-radius: 0 !important; }
      .crew-inc-tbl { font-size: 9.5px; }
      .crew-inc-tbl th.crew-inc-payh { color: #0a7a3d !important; }
      .crew-inc-tbl td.crew-inc-pay { background: none !important; }
      .crew-inc-tbl td.crew-inc-miss { color: #666 !important; }
      .crew-inc-grouprow td { background: #f4f4f4 !important; }
      .crew-inc-tbl th { background: #f0f0f0 !important; color: #000 !important;
        border-bottom: 1px solid #999 !important; position: static !important; }
      .crew-inc-tbl td { border-bottom: 1px solid #e4e4e4 !important; padding: 3px 6px; }
      .crew-inc-tbl tbody tr:hover td { background: transparent !important; }
      /* A person's row must not straddle a page break — half a payout line is unreadable
         and, on a payroll document, ambiguous. */
      .crew-inc-tbl tr { page-break-inside: avoid; }
      .crew-inc-sec { page-break-after: avoid; margin: 14px 0 5px; color: #000 !important; }
      /* Inputs are controls, not values. On paper they must read as what they hold. */
        .crew-inc-att { -webkit-appearance: none; appearance: none; width: auto; }
      /* Controls are not values; paper shows what they hold. */
      .crew-inc-edit, .crew-inc-revert { display: none !important; }
      .crew-inc-spiff { border: 0 !important; background: transparent !important;
        color: #000 !important; width: auto !important; padding: 0 !important;
        -webkit-appearance: none; appearance: none; }
      .crew-inc-att::after { content: '—'; color: #999; }
      .crew-inc-att:checked::after { content: '✓'; color: #0a7a3d; font-weight: 700; }
      .crew-inc-badge.is-imported { background: #fff !important; color: #8a5a12 !important;
        border: 1px solid #c9a05a !important; }
      .crew-inc-badge.is-live { background: #fff !important; color: #0a7a3d !important;
        border: 1px solid #7ab98f !important; }
    }


    /* ── Incentive settings tray — LEADERBOARD'S CSS, VERBATIM ────────────────────
       Copied from greencross-leaderboard/index.html rather than reimplemented. Sky spent real time
       on this layout and my rewrite was a worse version of it; the only thing changed below is
       nothing. What makes it work here is the alias block: that sheet names its colours --text,
       --green, --border; gx-theme names the same colours --gx-text, --gx-green, --gx-border. So the
       names are bridged ONCE, scoped to the tray, and every rule after it is byte-for-byte what
       Leaderboard ships. Re-copy on any change there rather than editing these by hand. */
    .inc-tray, .inc-tray-back {
      --surface: var(--gx-surface, #0f1512);
      --surface-2: var(--gx-surface-2, #0f1512);
      --surface-3: var(--gx-surface-3, #161d1a);
      --bg: var(--gx-bg);
      --border: var(--gx-border);
      --border-strong: var(--gx-border-strong);
      --text: var(--gx-text);
      --text-dim: var(--gx-text-dim, var(--gx-text));
      --text-mute: var(--gx-text-mute);
      --green: var(--gx-green);
      --green-dim: var(--gx-green-dim, #2f8a52);
      --amber: #eab308;
      --red: #f87171;
    }

.inc-tray-back { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 90; }
.inc-tray-back.open { opacity: 1; pointer-events: auto; }
.inc-tray { position: fixed; top: 0; right: 0; height: 100%; width: 360px; max-width: 88vw; background: var(--surface-2); border-left: 1px solid var(--border); box-shadow: -8px 0 28px rgba(0,0,0,0.55); transform: translateX(100%); transition: transform .22s ease; z-index: 91; display: flex; flex-direction: column; }
.inc-tray.open { transform: translateX(0); }
.inc-tray-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mute); }
.inc-tray-x { background: none; border: none; color: var(--text-mute); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.inc-tray-x:hover { color: var(--text); background: var(--bg); }
.inc-thr-grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 16px 18px; overflow-y: auto; }
.inc-thr-grid label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-dim); }
.inc-thr-grid input { width: 80px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 7px; text-align: right; }
.inc-thr-grid input:focus { outline: none; border-color: var(--green); }
.inc-savenote { font-size: 11px; color: var(--text-mute); margin-left: 8px; align-self: center; }
/* Discount-rules tray */
.inc-disc-tray { width: 420px; }
.inc-disc-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.inc-disc-msg { font-size: 13px; color: var(--text-mute); padding: 8px 0; }
.inc-disc-note { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin: 0; }
.inc-disc-list { display: flex; flex-direction: column; gap: 2px; }
.inc-disc-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
.inc-disc-row:hover { background: var(--bg); }
.inc-disc-tog { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; }
.inc-disc-name { font-size: 12.5px; color: var(--text); line-height: 1.35; }
.inc-disc-code { font-size: 10px; color: var(--text-mute); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 4px; white-space: nowrap; }
.inc-disc-state { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-mute); justify-self: end; min-width: 62px; text-align: right; }
.inc-disc-row:has(.inc-disc-tog:checked) .inc-disc-state { color: var(--green); }

.inc-disc-lockgrp { padding: 6px 0; }

.inc-disc-target { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.inc-disc-target-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: var(--text); }

.inc-disc-target-row input:focus { outline: none; border-color: var(--green); }

/* Veteran discount watch */
.inc-vet h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; color: var(--amber, #f0b429); }

/* Consolidated incentive settings tray (Claude Design import) */
.ist-tray { width: 440px; }

.ist-sub { margin: 0; font-size: 11.5px; color: var(--text-mute); line-height: 1.55; }

.ist-goalrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.ist-goalfield { display: flex; align-items: center; gap: 5px; }
.ist-goalinp { width: 62px; background: var(--bg); border: 1px solid var(--border-strong); color: var(--text); border-radius: 7px; padding: 7px 9px; text-align: right; font-size: 15px; font-weight: 600; }

/* ===== Period Standings (#/standings) ===== */
.stn-wrap { max-width: 1100px; margin: 0 auto; padding: 22px 24px 60px; }
.stn-num { font-variant-numeric: tabular-nums; }

.stn-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }

.stn-barwrap { grid-column: 1 / -1; margin-top: 12px; height: 7px; border-radius: 5px; background: var(--surface-3); position: relative; }
.stn-bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width 1s cubic-bezier(.2,.7,.3,1); }
.stn-bar.on { background: linear-gradient(90deg, #265939, var(--green)); }
.stn-bar.slight { background: linear-gradient(90deg, #7a5a12, var(--amber)); }
.stn-bar.behind { background: linear-gradient(90deg, #7a2c2c, var(--red)); }
.stn-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-dim); }
.stn-mark::after { content: "pace"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 8.5px; color: var(--text-mute); white-space: nowrap; }
.stn-hint { margin-top: 16px; color: var(--text-mute); font-size: 11.5px; text-align: center; }

  .stn-hero-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }

    GXMaintenance.init({
      app: 'crew', appName: 'GX Crew',
